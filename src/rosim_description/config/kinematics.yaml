/**:
  ros__parameters:
    # KDL solves the 6-DOF arm chain only. The composite "manipulator" group
    # (arm + rail_joint) is planned by OMPL; IK/Cartesian path solves hold the
    # rail at the allocated station, which keeps the wrist solver 6-DOF and
    # well conditioned.
    arm:
      kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
      kinematics_solver_search_resolution: 0.005
      kinematics_solver_timeout: 0.03
      kinematics_solver_attempts: 5
